<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Даяны ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&family=Playfair+Display:ital,wght@1,600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
        }

        /* Эффект парящих частиц (романтичный фон) */
        .particle {
            position: absolute;
            background: #ff2a6d;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.6;
            animation: float 10s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* Стартовый экран */
        #start-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            transition: opacity 1s ease;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-align: center;
            background: linear-gradient(45deg, #ff2a6d, #ff7eb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding: 0 20px;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            color: white;
            background: transparent;
            border: 2px solid #ff2a6d;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 42, 109, 0.4);
        }

        button:hover {
            background: #ff2a6d;
            box-shadow: 0 0 30px rgba(255, 42, 109, 0.8);
            transform: scale(1.05);
        }

        /* Основной контент */
        #main-content {
            display: none;
            opacity: 0;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 50px;
            width: 90%;
            max-width: 1000px;
            transition: opacity 1.5s ease;
            z-index: 5;
        }

        .photo-container {
            position: relative;
            flex-shrink: 0;
            width: 300px;
            height: 400px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 42, 109, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(20%) contrast(1.1);
            transition: transform 0.5s ease;
        }

        .photo-container:hover img {
            transform: scale(1.05);
        }

        .text-container {
            max-width: 500px;
            text-align: left;
        }

        .text-container h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: #ff2a6d;
            margin-bottom: 20px;
        }

        .text-container p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #ccc;
            margin-bottom: 15px;
        }

        .highlight {
            color: #fff;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(255, 42, 109, 0.5);
        }

        /* Адаптация для телефонов */
        @media (max-width: 768px) {
            #main-content {
                flex-direction: column;
                gap: 20px;
                text-align: center;
                padding: 20px;
                height: 90vh;
                overflow-y: auto;
            }
            .photo-container {
                width: 200px;
                height: 260px;
            }
            .text-container {
                text-align: center;
            }
            .text-container h2 {
                font-size: 1.5rem;
            }
            .text-container p {
                font-size: 1rem;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- Экран запуска -->
    <div id="start-screen">
        <h1>Даяна...</h1>
        <p style="color: #888; margin-bottom: 30px; text-align: center;">ты ахуеешь<br>звук увеличь🎧</p>
        <button id="start-btn">жми</button>
    </div>

    <!-- Основной контент -->
    <div id="main-content">
        <div class="photo-container">
            <!-- Сюда вставится твое фото -->
            <img src="photo.jpg" alt="Денис">
        </div>
        <div class="text-container">
            <h2>3 года 1358 дней уже вместе.</h2>
            <p>Любимая. Я тебя очень люблю</p>
            <p>ну ебать оно фармит ауру жиесть</p>
            <p>Спасибо за то, что ты всегда рядом со мной {heart}.</p>
            <p class="highlight">Я очень сильно тебя люблю, Даяна.<br>Твой денис.</p>
        </div>
    </div>

    <!-- Аудио -->
    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
        браузер не поддерживает аудио.
    </audio>

    <script>
        // Создаем романтичные частицы на фоне
        function createParticles() {
            const body = document.querySelector('body');
            for (let i = 0; i < 30; i++) {
                let particle = document.createElement('div');
                particle.classList.add('particle');
                
                let size = Math.random() * 8 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDuration = (Math.random() * 5 + 5) + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
                
                body.appendChild(particle);
            }
        }
        createParticles();

        // Логика запуска
        const startBtn = document.getElementById('start-btn');
        const startScreen = document.getElementById('start-screen');
        const mainContent = document.getElementById('main-content');
        const music = document.getElementById('bg-music');

        startBtn.addEventListener('click', () => {
            // Включаем музыку
            music.volume = 0.5; // Громкость 50%
            music.play().catch(error => {
                console.log("Автовоспроизведение заблокировано:", error);
            });

            // Плавно скрываем стартовый экран
            startScreen.style.opacity = '0';
            setTimeout(() => {
                startScreen.style.display = 'none';
                
                // Показываем контент
                mainContent.style.display = 'flex';
                // Небольшая задержка, чтобы сработала CSS-транзиция
                setTimeout(() => {
                    mainContent.style.opacity = '1';
                }, 50);
                
            }, 1000); // Ждем, пока отработает анимация прозрачности
        });
    </script>
</body>
</html>
